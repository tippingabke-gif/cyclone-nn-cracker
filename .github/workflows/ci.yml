name: Windows source and compilation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64
      - name: Parse Python sources and validate manifests
        run: python tools/check_sources.py
      - name: Compile C# sources without running the helpers
        shell: powershell
        run: ./tools/build-check.ps1
